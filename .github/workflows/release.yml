# When a release is published on GitHub, this builds one zip per addon and attaches them to it.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each addon
        run: |
          for toc in */*.toc; do
            dir=$(dirname "$toc")
            zip -r "$dir.zip" "$dir"
          done
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.zip --clobber
