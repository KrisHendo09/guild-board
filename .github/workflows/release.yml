# When a release is published on GitHub, this builds one zip per addon, attaches them to it,
# and uploads Guild Board to CurseForge (if the CF_API_KEY secret and the toc project id are set).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each addon
        run: |
          for toc in */*.toc; do
            dir=$(dirname "$toc")
            zip -r "$dir.zip" "$dir"
          done
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.zip --clobber
      - name: Upload Guild Board to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
        run: python3 tools/curseforge_upload.py
