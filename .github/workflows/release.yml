# Builds one zip per addon, attaches them to the GitHub release, and uploads Guild Board to CurseForge
# (if the CF_API_KEY secret and the toc project id are set). Two ways in:
#  1. A release is published by hand on GitHub (feature releases).
#  2. "Run workflow" with a version like 1.5.2 (the bug fix schedule starts it this way). The workflow then makes
#     the tag and the release itself from main, with notes from that version's section of CHANGELOG.md.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version: {description: 'Version to release from main, must match the toc (example 1.5.2)', required: true}
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Started by hand or by the schedule, make the release
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Bad version $VER"; exit 1; fi
          if [ "${{ github.ref_name }}" != "main" ]; then echo "Run this from main"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          TOCVER=$(grep -m1 '^## Version:' GuildBoard/GuildBoard.toc | awk '{print $3}' | tr -d '\r')
          if [ "$VER" != "$TOCVER" ]; then echo "Version $VER does not match the toc version $TOCVER"; exit 1; fi
          python3 - "$VER" <<'PY'
          import re, sys
          ver = sys.argv[1]; log = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'### ' + re.escape(ver) + r'[^\n]*\n(.*?)(?=\n### |\n## |\Z)', log, re.S)
          open('notes.md', 'w', encoding='utf-8').write((m.group(1).strip() if m else f'Guild Board {ver}') + '\n\nUpdate through the CurseForge app, or download GuildBoard.zip below and fully restart WoW.\n')
          PY
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Guild Board $VER" --notes-file notes.md
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - name: Zip each addon
        if: steps.gate.outputs.go == 'yes'
        run: |
          for toc in */*.toc; do
            dir=$(dirname "$toc")
            zip -r "$dir.zip" "$dir"
          done
      - name: Attach zips to the release
        if: steps.gate.outputs.go == 'yes'
        run: gh release upload "$TAG" *.zip --clobber
      - name: Upload Guild Board to CurseForge
        if: steps.gate.outputs.go == 'yes'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
        run: python3 tools/curseforge_upload.py
