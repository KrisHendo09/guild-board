# Push a tag like v1.2.0 and this builds one zip per addon and attaches them to a GitHub release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each addon
        run: |
          for toc in */*.toc; do
            dir=$(dirname "$toc")
            zip -r "$dir.zip" "$dir"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
