# Posts or updates the Guild Board roster card in Discord through a channel webhook.
# Run it from the Actions tab or the API with the roster JSON from tools/roster_json.py.
# The webhook URL lives in the repo secret DISCORD_WEBHOOK_URL and is never printed.
name: Discord roster
on:
  workflow_dispatch:
    inputs:
      roster:
        description: Roster JSON (output of tools/roster_json.py)
        required: true
      message_id:
        description: Discord message id to edit (blank posts a new card)
        required: false
        default: ""
      guild_name:
        description: Title shown on the card
        required: false
        default: Push to Prod
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post roster card
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROSTER_JSON: ${{ inputs.roster }}
          MESSAGE_ID: ${{ inputs.message_id }}
          GUILD_NAME: ${{ inputs.guild_name }}
        run: python3 tools/discord_roster.py
