# One-off cleanup: deletes the old test roster card. Removed after use.
name: Discord roster
on:
  workflow_dispatch:
    inputs:
      message_id:
        required: true
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete test card
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.GUILD_BOARD }}
          MID: ${{ inputs.message_id }}
        run: |
          echo "webhook id: $(echo "$HOOK" | cut -d/ -f6)"
          curl -sS -o /dev/null -w "delete status %{http_code}\n" -X DELETE "$HOOK/messages/$MID"
