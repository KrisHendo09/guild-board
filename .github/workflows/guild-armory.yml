# Posts the Push To Prod guild board (crafting board + roster panels) to #guild-board every hour,
# built from the WoW Forever Armory API, so no addon or computer is needed.
# Secrets: BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, GUILD_BOARD (webhook URL).
# It only edits the existing posts (EDIT_ONLY) so it can never spam the channel.
name: Guild Board to Discord
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      fresh_post:
        description: Post brand new panels (only after the old posts were deleted)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore level history (for the This Week column)
        uses: actions/cache@v4
        with:
          path: tools/out/level_history.json
          key: level-history-${{ github.run_id }}
          restore-keys: level-history-
      - name: Install Pillow and fonts
        run: |
          pip install --quiet pillow
          fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - name: Build and post the board
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.GUILD_BOARD }}
          DISCORD_MESSAGE_IDS: ${{ inputs.fresh_post && 'none' || vars.DISCORD_MESSAGE_IDS || '1571426762498252840,1571426772237418537,1571426778344591421' }}
          EDIT_ONLY: ${{ !inputs.fresh_post && '1' || '' }}
        run: python tools/guild_armory.py
